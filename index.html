<!doctype html><html lang="tl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoryVerse</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f7;color:#222;font:15px Arial}.bar{height:60px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:18px;padding:0 6%;position:sticky;top:0;z-index:5}.logo{font-size:23px;font-weight:900;color:#ff5b25}.search{flex:1;max-width:500px;border:0;background:#f0f0f0;border-radius:22px;padding:11px 16px}.nav button{border:0;background:none;cursor:pointer;font-weight:bold;margin-left:8px}.wrap{max-width:1050px;margin:auto;padding:24px 16px}.grid{display:grid;grid-template-columns:1fr 280px;gap:20px}.card{background:#fff;border:1px solid #ddd;border-radius:6px;padding:18px;margin-bottom:14px}.story{display:flex;gap:15px}.cover{width:90px;height:125px;background:linear-gradient(145deg,#24134d,#ff5b25);color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:bold;padding:8px;flex:none}.story h2{margin:3px 0}.muted{color:#777;line-height:1.5}.tag{display:inline-block;background:#eee;border-radius:14px;padding:5px 9px;font-size:11px;margin:3px}.btn{padding:10px 16px;border:0;border-radius:4px;cursor:pointer;font-weight:bold}.orange{background:#ff5b25;color:#fff}.light{background:#eee}.hidden{display:none}.form{max-width:600px;margin:auto}.form input,.form textarea,.form select{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #ccc;border-radius:4px;font:inherit}.form textarea{min-height:260px}.reader{max-width:760px;margin:auto;background:white;padding:35px 7%;min-height:80vh}.reader h1{font:38px Georgia}.reader .content{font:19px Georgia;line-height:1.9;white-space:pre-wrap}.profile{display:flex;gap:15px;align-items:center}.avatar{width:70px;height:70px;border-radius:50%;background:#ff5b25;color:#fff;display:grid;place-items:center;font-size:25px;font-weight:bold}@media(max-width:760px){.grid{grid-template-columns:1fr}.bar{padding:0 12px}.search{max-width:180px}.nav button{margin:0 2px}.side{display:none}}
</style></head><body><header class="bar"><div class="logo">storyverse</div><input id="search" class="search" placeholder="Search stories..." oninput="loadStories()"><div class="nav"><button onclick="home()">Home</button><button onclick="writeStory()">Write</button><button onclick="profile()">Profile</button><button id="auth" onclick="login()">Login</button></div></header>
<main id="app" class="wrap"></main>
<script>
const A=document.getElementById("app");let stories=[];
async function api(u,o){let r=await fetch(u,{headers:{"Content-Type":"application/json"},...o});let x=await r.json().catch(()=>({}));if(!r.ok)throw Error(x.error||"Error");return x}
async function me(){return (await api("/api/me")).user}
async function home(){A.innerHTML='<h2>For You</h2><div class="grid"><section id="feed"></section><aside class="card side"><h3>✍️ Become a writer</h3><p class="muted">Gumawa ng sariling profile at i-publish ang story mo. Lahat ng vote ay magsisimula sa 0.</p><button class="btn orange" onclick="writeStory()">Start Writing</button></aside></div>';await loadStories()}
async function loadStories(){let q=document.getElementById("search")?.value.toLowerCase()||"";stories=await api("/api/stories");let f=document.getElementById("feed");if(!f)return;let a=stories.filter(s=>(s.title+" "+s.username+" "+s.genre).toLowerCase().includes(q));f.innerHTML=a.length?a.map(s=>`<article class="card story"><div class="cover">${esc(s.title.slice(0,22))}</div><div><small>by ${esc(s.username)}</small><h2>${esc(s.title)}</h2><p class="muted">${esc(s.description)}</p><span class="tag">${esc(s.genre)}</span><div class="muted">👁 0 Reads · ❤️ ${s.votes||0} Votes</div><button class="btn orange" onclick="read(${s.id})">Read</button></div></article>`).join(""):'<div class="card">No stories yet.</div>'}
async function read(id){let s=await api("/api/stories/"+id);A.innerHTML=`<article class="reader"><button class="btn light" onclick="home()">← Back</button><p class="muted">by ${esc(s.username)} · ${esc(s.genre)}</p><h1>${esc(s.title)}</h1><p class="muted">${esc(s.description)}</p><div class="content">${esc(s.content)}</div><hr><button class="btn orange" onclick="vote(${s.id})">❤️ Vote (${s.votes||0})</button></article>`}
async function vote(id){try{let r=await api("/api/stories/"+id+"/vote",{method:"POST"});alert(r.voted?"Vote added!":"Vote removed.");read(id)}catch(e){alert("Kailangan mong mag-login para bumoto.")}}
async function writeStory(){if(!await me())return login();A.innerHTML=`<div class="form card"><h2>✎ Write a Story</h2><label>Title</label><input id="t" placeholder="Story title"><label>Description</label><input id="d" placeholder="Maikling description"><label>Genre</label><select id="g"><option>Fantasy</option><option>Adventure</option><option>Mystery</option><option>Comedy</option><option>Science Fiction</option><option>Horror</option><option>Other</option></select><label>Story / Chapter 1</label><textarea id="c" placeholder="Isulat dito ang kuwento..."></textarea><button class="btn orange" onclick="publish()">Publish Story</button></div>`}
async function publish(){try{let r=await api("/api/stories",{method:"POST",body:JSON.stringify({title:t.value,description:d.value,genre:g.value,content:c.value})});alert("Published!");home()}catch(e){alert(e.message)}}
async function login(){A.innerHTML=`<div class="form card"><h2>Login</h2><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button class="btn orange" onclick="doLogin()">Login</button> <button class="btn light" onclick="register()">Create account</button></div>`}
async function doLogin(){try{await api("/api/login",{method:"POST",body:JSON.stringify({username:u.value,password:p.value})});home();setAuth()}catch(e){alert(e.message)}}
async function register(){A.innerHTML=`<div class="form card"><h2>Create your profile</h2><p class="muted">Username at password lang ang kailangan. Huwag maglagay ng sensitibong impormasyon.</p><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button class="btn orange" onclick="doRegister()">Sign up</button> <button class="btn light" onclick="login()">Back</button></div>`}
async function doRegister(){try{await api("/api/register",{method:"POST",body:JSON.stringify({username:u.value,password:p.value})});home();setAuth()}catch(e){alert(e.message)}}
async function profile(){let x=await me();if(!x)return login();let p=await api("/api/users/"+encodeURIComponent(x.username));A.innerHTML=`<div class="card profile"><div class="avatar">${esc(x.username[0].toUpperCase())}</div><div><h2>${esc(x.username)}</h2><p class="muted">${esc(x.bio||"No bio yet.")}</p></div></div><div class="card"><h3>Your Stories</h3>${p.stories.map(s=>`<p><b>${esc(s.title)}</b> · ❤️ ${s.votes||0}</p>`).join("")||"Wala ka pang story."}<button class="btn light" onclick="editProfile()">Edit Profile</button> <button class="btn light" onclick="logout()">Logout</button></div>`}
async function editProfile(){let x=await me();A.innerHTML=`<div class="form card"><h2>Edit Profile</h2><label>Bio</label><textarea id="b" style="height:140px">${esc(x.bio||"")}</textarea><label>Avatar image URL (optional)</label><input id="av" value="${esc(x.avatar||"")}"><button class="btn orange" onclick="saveProfile()">Save</button></div>`}
async function saveProfile(){await api("/api/profile",{method:"PUT",body:JSON.stringify({bio:b.value,avatar:av.value})});profile()}
async function logout(){await api("/api/logout",{method:"POST"});home();setAuth()}
async function setAuth(){let x=await me();document.getElementById("auth").textContent=x?"Logout":"Login";document.getElementById("auth").onclick=x?logout:login}
function esc(s=""){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
setAuth();home();
</script></body></html>
